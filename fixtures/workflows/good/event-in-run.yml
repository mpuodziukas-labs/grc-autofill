# GREEN twin of R4: event field passed through env, not expanded in the script. Synthetic.
name: greet
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.issue.title }}
        run: echo "title is $TITLE"
